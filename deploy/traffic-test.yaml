apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-tests
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: traffic-runner, namespace: ovn-light-tests}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: traffic-runner, namespace: ovn-light-tests}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [create, get, list, watch]
- apiGroups: [""]
  resources: [services]
  verbs: [create, get]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: traffic-runner, namespace: ovn-light-tests}
subjects:
- {kind: ServiceAccount, name: traffic-runner, namespace: ovn-light-tests}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: traffic-runner}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ovn-light-traffic-runner-nodes}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ovn-light-traffic-runner-nodes}
subjects:
- {kind: ServiceAccount, name: traffic-runner, namespace: ovn-light-tests}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ovn-light-traffic-runner-nodes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: traffic-jobs, namespace: ovn-light-tests}
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: traffic-jobs, namespace: ovn-light-tests}
subjects:
- {kind: ServiceAccount, name: ovn-light, namespace: ovn-light}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: traffic-jobs}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: ovn-light-traffic-test, namespace: ovn-light}
data:
  OVN_LIGHT_TRAFFIC_TEST_IMAGE: ovn-light-tft:9f911a1-v3
