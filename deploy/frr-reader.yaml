# Apply after installing FRR-k8s. For OpenShift, change the namespace to
# openshift-frr-k8s. This grants diagnostic exec, not configuration writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ovn-light-frr-reader
  namespace: frr-k8s-system
rules:
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ovn-light-frr-reader
  namespace: frr-k8s-system
subjects:
- kind: ServiceAccount
  name: ovn-light
  namespace: ovn-light
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ovn-light-frr-reader
