apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-topology
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: ovn-light-topology
  labels: {app: server}
spec:
  tolerations:
  - {operator: Exists, effect: NoSchedule}
  containers:
  - name: server
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [netexec, "--http-port=8080", "--udp-port=-1"]
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: ovn-light-topology
spec:
  clusterIP: None
  selector: {app: server}
  ports: [{port: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ovn-light-topology
  labels: {app: client}
spec:
  tolerations:
  - {operator: Exists, effect: NoSchedule}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector: {matchLabels: {app: server}}
        topologyKey: kubernetes.io/hostname
  containers:
  - name: client
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    command: [/bin/sh, -c]
    args:
    - |
      while true; do
        # The final dot prevents runner-specific DNS search domains being appended.
        target="$(getent ahostsv4 server.ovn-light-topology.svc.cluster.local. | awk 'NR==1 {print $1}')"
        if [ -n "$target" ]; then
          printf '%s\n' "$target" > /tmp/ovn-light-target
          break
        fi
        sleep 1
      done
      while true; do
        if wget -q -T 2 -O /dev/null "http://$target:8080/hostname"; then
          touch /tmp/ovn-light-traffic-ok
        fi
        sleep 0.2
      done
    readinessProbe:
      exec:
        command: [/bin/sh, -c, "test -s /tmp/ovn-light-target"]
      periodSeconds: 2
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-server
  namespace: ovn-light-topology
spec:
  podSelector: {matchLabels: {app: server}}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ovn-light-probe
  namespace: ovn-light-topology
rules:
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ovn-light-probe
  namespace: ovn-light-topology
subjects:
- {kind: ServiceAccount, name: ovn-light, namespace: ovn-light}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ovn-light-probe}
