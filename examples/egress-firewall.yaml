apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-egress
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ovn-light-egress
  labels: {app: client}
spec:
  containers:
  - name: client
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [pause]
---
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: ovn-light-egress
spec:
  egress:
  - type: Allow
    to: {cidrSelector: 192.0.2.0/24}
  - type: Deny
    to: {cidrSelector: 0.0.0.0/0}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ovn-light-probe
  namespace: ovn-light-egress
rules:
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ovn-light-probe
  namespace: ovn-light-egress
subjects:
- {kind: ServiceAccount, name: ovn-light, namespace: ovn-light}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ovn-light-probe}
