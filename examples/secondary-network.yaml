# Requires Multus and OVN multi-network policy enforcement.
apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-secondary
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: blue
  namespace: ovn-light-secondary
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "ovn-light-secondary-blue",
      "netAttachDefName": "ovn-light-secondary/blue",
      "type": "ovn-k8s-cni-overlay",
      "topology": "layer2",
      "subnets": "10.210.0.0/24"
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ovn-light-secondary
  labels: {app: client}
  annotations:
    k8s.v1.cni.cncf.io/networks: blue
spec:
  containers:
  - name: client
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [pause]
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: ovn-light-secondary
  labels: {app: server}
  annotations:
    k8s.v1.cni.cncf.io/networks: blue
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector: {matchLabels: {app: client}}
        topologyKey: kubernetes.io/hostname
  containers:
  - name: server
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [netexec, "--http-port=8080", "--udp-port=-1"]
    ports: [{containerPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-primary
  namespace: ovn-light-secondary
spec:
  podSelector: {matchLabels: {app: server}}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: deny-blue
  namespace: ovn-light-secondary
  annotations:
    k8s.v1.cni.cncf.io/policy-for: blue
spec:
  podSelector: {matchLabels: {app: server}}
  policyTypes: [Ingress]
  ingress: []
