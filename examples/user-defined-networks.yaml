# Requires OVN-Kubernetes network segmentation and ClusterNetworkConnect support.
apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-red
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-blue
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: red
  namespace: ovn-light-red
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets: [10.200.10.0/24]
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: blue
  namespace: ovn-light-blue
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets: [10.200.20.0/24]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ovn-light-red
  labels: {app: client}
spec:
  containers:
  - name: client
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [pause]
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: ovn-light-red
  labels: {app: server}
spec:
  containers:
  - name: server
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [netexec, "--http-port=8080", "--udp-port=-1"]
    ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: ovn-light-blue
  labels: {app: server}
spec:
  containers:
  - name: server
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [netexec, "--http-port=8080", "--udp-port=-1"]
    ports: [{containerPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-server
  namespace: ovn-light-red
spec:
  podSelector: {matchLabels: {app: server}}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ovn-light-probe
  namespace: ovn-light-red
rules:
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ovn-light-probe
  namespace: ovn-light-red
subjects:
- {kind: ServiceAccount, name: ovn-light, namespace: ovn-light}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ovn-light-probe}
