apiVersion: v1
kind: Namespace
metadata:
  name: ovn-light-qos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ovn-light-qos
  name: ovn-light-probe
rules:
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: ovn-light-qos
  name: ovn-light-probe
subjects:
- kind: ServiceAccount
  namespace: ovn-light
  name: ovn-light
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ovn-light-probe
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ovn-light-qos
  name: server
  labels: {app: qos-server}
spec:
  containers:
  - name: server
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    args: [netexec, --http-port=8080, --udp-port=-1]
---
apiVersion: v1
kind: Service
metadata:
  namespace: ovn-light-qos
  name: server
spec:
  selector: {app: qos-server}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ovn-light-qos
  name: client
  labels: {app: qos-client}
  annotations:
    kubernetes.io/egress-bandwidth: 20M
    kubernetes.io/ingress-bandwidth: 20M
spec:
  containers:
  - name: client
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    command: [/bin/sh, -c]
    args: ['while true; do /agnhost connect server:8080 --timeout=2s; sleep 2; done']
---
apiVersion: k8s.ovn.org/v1alpha1
kind: NetworkQoS
metadata:
  namespace: ovn-light-qos
  name: client-egress
spec:
  priority: 50
  podSelector:
    matchLabels: {app: qos-client}
  egress:
  - dscp: 20
    classifier:
      ports: [{protocol: TCP, port: 8080}]
    bandwidth: {rate: 10000, burst: 1000}
---
apiVersion: k8s.ovn.org/v1
kind: EgressQoS
metadata:
  namespace: ovn-light-qos
  name: default
spec:
  egress:
  - dscp: 10
    podSelector:
      matchLabels: {app: qos-server}
